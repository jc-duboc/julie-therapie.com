name: Render and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily at 04:17 UTC so the Vidéos page picks up new YouTube uploads
    # without anyone having to push a commit.
    - cron: "17 4 * * *"

# Only one deploy at a time; do not cancel in-flight runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Refresh YouTube playlist data
        run: node scripts/fetch-youtube-playlists.mjs

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.12"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Render Quarto site
        run: quarto render

      - name: Check SITE_PASSWORD secret is set
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [[ -z "$SITE_PASSWORD" ]]; then
            echo "::error::SITE_PASSWORD secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Strip content-leaking artefacts
        # staticrypt only encrypts HTML, so any non-HTML asset that exposes
        # content or structure has to be removed/neutralised by hand:
        #   - search.json / listings.json: full-text index and listing metadata
        #   - sitemap.xml: leaks the page graph
        #   - llms.txt: leaks a curated site summary for LLM crawlers
        #   - robots.txt: rewritten to "Disallow: /" so search engines do NOT
        #     index the encrypted password-prompt pages (would otherwise stick
        #     around in Google's index long after launch)
        # When the staticrypt phase is removed at launch, delete this entire
        # step too: robots.txt and llms.txt will then be served as-is, and the
        # JSON index files will be regenerated normally by Quarto.
        run: |
          rm -f _site/search.json _site/sitemap.xml _site/llms.txt
          find _site -name "listings.json" -type f -print -delete
          cat > _site/robots.txt <<'EOF'
          # Site temporarily protected by staticrypt — do not index.
          User-agent: *
          Disallow: /
          EOF

      - name: Install staticrypt
        run: npm install -g staticrypt

      - name: Encrypt rendered site
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: staticrypt _site/* -r -d _site -p "$SITE_PASSWORD" --short

      - name: Fix permissions
        run: |
          chmod -v -R +rX _site | while read line; do
            echo "::warning title=Invalid file permissions automatically fixed::$line"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
